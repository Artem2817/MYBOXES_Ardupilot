name: Build MyboxH743 Mini v2 release
run-name: Mini v2 + Vib — ${{ inputs.version }}-r${{ inputs.revision }} (${{ inputs.channel }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ArduPilot source version"
        required: true
        default: "4.7.1"
        type: string
      revision:
        description: "MYBOXES release revision number"
        required: true
        default: "1"
        type: string
      channel:
        description: "Release channel"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - beta
          - stable

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Mini v2 versions
    runs-on: ubuntu-latest
    outputs:
      version_label: ${{ steps.version.outputs.version_label }}
      is_prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Validate version and reserve both tags
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 4.7.1" >&2
            exit 1
          fi
          if [[ ! "$REVISION" =~ ^[1-9][0-9]*$ ]]; then
            echo "Revision must be a positive number" >&2
            exit 1
          fi
          suffix=""
          prerelease="false"
          if [[ "$CHANNEL" != "stable" ]]; then
            suffix="-$CHANNEL"
            prerelease="true"
          fi
          label="$VERSION-r$REVISION$suffix"
          for variant in mini-v2 mini-v2-vib; do
            tag="myboxh743-$variant-$label"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $tag already exists. Increase the revision." >&2
              exit 1
            fi
          done
          echo "version_label=$label" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.board }} Copter, Plane and Rover
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: ardupilot/ardupilot-dev-chibios:v0.1.3
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: MyboxH743_mini_v2
            variant: mini-v2
          - board: MyboxH743_mini_v2_vib
            variant: mini-v2-vib
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Trust the checked-out repository in the build container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install firmware packaging tool
        run: python3 -m pip install --disable-pip-version-check intelhex==2.3.0

      - name: Build board firmware
        env:
          RELEASE_BOARD: ${{ matrix.board }}
          RELEASE_TAG: myboxh743-${{ matrix.variant }}-${{ needs.prepare.outputs.version_label }}
        run: >-
          python3 Tools/scripts/build_myboxes_release.py
          --board "$RELEASE_BOARD"
          --label "$RELEASE_TAG"
          --output-dir "release/$RELEASE_BOARD"

      - name: Upload board build result
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board }}
          path: release/${{ matrix.board }}/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish ${{ matrix.variant }} release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: MyboxH743_mini_v2
            variant: mini-v2
            title: MyboxH743 Mini v2
          - board: MyboxH743_mini_v2_vib
            variant: mini-v2-vib
            title: MyboxH743 Mini v2 Vib
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: myboxh743-${{ matrix.variant }}-${{ needs.prepare.outputs.version_label }}
      RELEASE_TITLE: ${{ matrix.title }} ${{ needs.prepare.outputs.version_label }}
      IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
    steps:
      - name: Download board firmware files
        uses: actions/download-artifact@v8
        with:
          name: firmware-${{ matrix.board }}
          path: release

      - name: Publish versioned release
        shell: bash
        run: |
          mapfile -d '' files < <(find release -type f -print0 | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo "No release files were downloaded" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Increase the revision." >&2
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          Current Mini v2 hardware definitions, prepared with AI assistance.

          - Main IMU: ICM-45686 on SPI2; SPA06-003 barometer; AT7456E OSD.
          - Vib adds ICM-42670-P on SPI1 and a second SPA06-003 at 0x77.
          - 13 PWM outputs, I2C4 on GPS2, separate CAN silent controls.
          - Heater PA15: main IMU feedback on Mini v2, isolated IMU feedback on Vib.
          - Main IMU rotation is preserved. Vib module rotation is temporary ROTATION_NONE.
          - Heater is disabled by default (BRD_HEAT_TARG=-1). Bidirectional DShot is not enabled.

          These builds are compile-validated; hardware and flight validation remain pending.
          NOTES
          prerelease_args=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            "${prerelease_args[@]}"
