name: Build MyboxH743 Mini release
run-name: Mini — ${{ inputs.version }}-r${{ inputs.revision }} (${{ inputs.channel }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ArduPilot source version"
        required: true
        default: "4.7.1"
        type: string
      revision:
        description: "MYBOXES release revision number"
        required: true
        default: "2"
        type: string
      channel:
        description: "Release channel"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - beta
          - stable

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Mini version
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
      release_title: ${{ steps.version.outputs.title }}
      is_prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Validate version and reserve tag
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 4.7.1" >&2
            exit 1
          fi
          if [[ ! "$REVISION" =~ ^[1-9][0-9]*$ ]]; then
            echo "Revision must be a positive number" >&2
            exit 1
          fi
          suffix=""
          prerelease="false"
          if [[ "$CHANNEL" != "stable" ]]; then
            suffix="-$CHANNEL"
            prerelease="true"
          fi
          tag="myboxh743-mini-$VERSION-r$REVISION$suffix"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists. Increase the revision." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=MyboxH743_mini $VERSION-r$REVISION ($CHANNEL)" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: Build Mini Copter, Plane and Rover
    needs: prepare
    runs-on: ubuntu-latest
    container: ardupilot/ardupilot-dev-chibios:v0.1.3
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Trust the checked-out repository in the build container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install firmware packaging tool
        run: python3 -m pip install --disable-pip-version-check intelhex==2.3.0

      - name: Build Mini firmware
        env:
          RELEASE_BOARD: MyboxH743_mini
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: >-
          python3 Tools/scripts/build_myboxes_release.py
          --board "$RELEASE_BOARD"
          --label "$RELEASE_TAG"
          --output-dir "release/$RELEASE_BOARD"

      - name: Upload Mini build result
        uses: actions/upload-artifact@v4
        with:
          name: firmware-MyboxH743_mini
          path: release/MyboxH743_mini/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Mini release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_TITLE: ${{ needs.prepare.outputs.release_title }}
      IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
    steps:
      - name: Download Mini firmware files
        uses: actions/download-artifact@v4
        with:
          name: firmware-MyboxH743_mini
          path: release

      - name: Create immutable Mini release
        shell: bash
        run: |
          mapfile -d '' files < <(find release -type f -print0 | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo "No release files were downloaded" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Increase the revision." >&2
            exit 1
          fi

          prerelease_args=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --generate-notes \
            "${prerelease_args[@]}"
